[pytest]
testpaths = tests
pythonpath = .
addopts = -ra -v --strict-markers -p no:cacheprovider -p pytester
markers =
    free: makes no model call; needs no API key and costs nothing (runs on every change)
    model: calls the model; needs ANTHROPIC_API_KEY and costs tokens (nightly / pre-release)
# pytest-timeout: per-test cap, and a cap on the whole run.
timeout = 120
session_timeout = 1500
# A known-defect xfail that starts to pass fails the run, so it gets noticed.
xfail_strict = true
junit_family = xunit2
# Suite logs (format in harness/log_format.py): captured per test into
# report.html; the entrypoint also writes them all to suite.log.
log_level = DEBUG
log_file_level = DEBUG
